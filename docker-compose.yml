# Dev stack. Run locally with `docker compose up --build`; see README.
# All settings come from .env (copy .env.example).

x-app: &app
  build: .
  env_file: .env
  environment:
    NASSCAN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # In .env, NASSCAN_SCAN_ROOT is the host folder to mount; inside, it's always /scan.
    NASSCAN_SCAN_ROOT: /scan
    NASSCAN_CLAMD_HOST: clamd
  restart: unless-stopped

services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${NASSCAN_DB_PUBLISH_PORT:-5434}:5432"
    healthcheck:
      # Over TCP: during first-run init, Postgres listens only on its socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 2m
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["nasscan", "migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["nasscan", "api"]
    ports:
      - "${NASSCAN_API_PUBLISH_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  scanner:
    <<: *app
    command: ["nasscan", "scanner"]
    volumes:
      - ${NASSCAN_SCAN_ROOT:-./samples}:/scan:ro
      - scanner-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/nasscan-scanner-heartbeat') > 60)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ClamAV (deploy/clamd: the official image plus unofficial signatures). The scanner streams
  # files to it, so it needs no access to the data. The first start downloads the signatures
  # (a few minutes); it uses about 1.5 GB of RAM.
  clamd:
    build: ./deploy/clamd
    volumes:
      - clamav-db:/var/lib/clamav
    restart: unless-stopped

  web:
    image: node:24-slim
    working_dir: /web
    command: ["sh", "-c", "npm ci && npm run dev"]
    environment:
      NASSCAN_API_PROXY: http://api:8000
      VITE_POLL: "1"
    volumes:
      - ./web:/web
      - web-node-modules:/web/node_modules
    ports:
      - "${NASSCAN_WEB_PUBLISH_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  clamav-db:
  scanner-data:
  web-node-modules:
