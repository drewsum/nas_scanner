# Server stack. Deployed by Portainer as a Git-repository stack with GitOps updates
# (docs/deploy-portainer.md), or with plain `docker compose` from a checkout on the host
# (docs/deploy-truenas.md), which adds deploy/compose.build.yml to build the image locally.
#
# GitOps: on every push to main, GitHub Actions builds the image, pushes it to GHCR, and then
# rewrites the image tag below in a "[skip ci]" commit. Portainer polls the repo, sees that
# commit and redeploys, so it only ever redeploys onto an image that already exists.
#
# All settings come from env vars, passed in explicitly below (Portainer doesn't write a
# stack.env that compose can read for Git stacks).

# Every NASSCAN_* setting from .env.example. Blank values fall back to the app's defaults.
x-nasscan-env: &nasscan-env
  NASSCAN_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  NASSCAN_INCREMENTAL_CRON: ${NASSCAN_INCREMENTAL_CRON:-}
  NASSCAN_FULL_CRON: ${NASSCAN_FULL_CRON:-}
  NASSCAN_EXCLUDE_GLOBS: ${NASSCAN_EXCLUDE_GLOBS:-}
  NASSCAN_SCAN_WORKERS: ${NASSCAN_SCAN_WORKERS:-}
  NASSCAN_MAX_READ_MBPS: ${NASSCAN_MAX_READ_MBPS:-}
  NASSCAN_SCANNER_NICE: ${NASSCAN_SCANNER_NICE:-}
  NASSCAN_SCANNER_IONICE_IDLE: ${NASSCAN_SCANNER_IONICE_IDLE:-}
  NASSCAN_MEMORY_READ_MB: ${NASSCAN_MEMORY_READ_MB:-}
  NASSCAN_LARGE_FILE_MB: ${NASSCAN_LARGE_FILE_MB:-}
  NASSCAN_PARTIAL_CHUNK_MB: ${NASSCAN_PARTIAL_CHUNK_MB:-}
  NASSCAN_LARGE_MEDIA_FULL_READ: ${NASSCAN_LARGE_MEDIA_FULL_READ:-}
  NASSCAN_MEDIA_FOLDERS: ${NASSCAN_MEDIA_FOLDERS:-}
  NASSCAN_EMBEDDED_MAX_MB: ${NASSCAN_EMBEDDED_MAX_MB:-}
  NASSCAN_CLAMD_HOST: ${NASSCAN_CLAMD_HOST:-clamd}
  NASSCAN_CLAMD_STREAM_MAX_MB: ${NASSCAN_CLAMD_STREAM_MAX_MB:-}
  NASSCAN_YARA_SOURCES: ${NASSCAN_YARA_SOURCES:-}
  NASSCAN_YARA_REFRESH_HOURS: ${NASSCAN_YARA_REFRESH_HOURS:-}
  NASSCAN_INTEL_FEEDS: ${NASSCAN_INTEL_FEEDS:-}
  NASSCAN_VIRUSSHARE_LISTS: ${NASSCAN_VIRUSSHARE_LISTS:-}
  NASSCAN_INTEL_EXTRA_FEEDS: ${NASSCAN_INTEL_EXTRA_FEEDS:-}
  NASSCAN_INTEL_FEED_REFRESH_HOURS: ${NASSCAN_INTEL_FEED_REFRESH_HOURS:-}
  NASSCAN_INTEL_LOOKUPS: ${NASSCAN_INTEL_LOOKUPS:-}
  NASSCAN_INTEL_DISABLED: ${NASSCAN_INTEL_DISABLED:-}
  NASSCAN_INTEL_LIMITS: ${NASSCAN_INTEL_LIMITS:-}
  NASSCAN_INTEL_RECHECK_DAYS: ${NASSCAN_INTEL_RECHECK_DAYS:-}
  NASSCAN_INTEL_HIT_RECHECK_DAYS: ${NASSCAN_INTEL_HIT_RECHECK_DAYS:-}
  NASSCAN_ABUSECH_AUTH_KEY: ${NASSCAN_ABUSECH_AUTH_KEY:-}
  NASSCAN_VIRUSTOTAL_API_KEY: ${NASSCAN_VIRUSTOTAL_API_KEY:-}
  NASSCAN_HYBRID_ANALYSIS_API_KEY: ${NASSCAN_HYBRID_ANALYSIS_API_KEY:-}
  NASSCAN_METADEFENDER_API_KEY: ${NASSCAN_METADEFENDER_API_KEY:-}
  NASSCAN_OTX_API_KEY: ${NASSCAN_OTX_API_KEY:-}
  NASSCAN_OPENTIP_API_KEY: ${NASSCAN_OPENTIP_API_KEY:-}
  NASSCAN_ADMIN_PASSWORD: ${NASSCAN_ADMIN_PASSWORD:-}
  NASSCAN_SESSION_DAYS: ${NASSCAN_SESSION_DAYS:-}
  NASSCAN_TRUSTED_PROXIES: ${NASSCAN_TRUSTED_PROXIES:-}
  NASSCAN_BACKUP_INTERVAL_HOURS: ${NASSCAN_BACKUP_INTERVAL_HOURS:-}
  NASSCAN_BACKUP_KEEP: ${NASSCAN_BACKUP_KEEP:-}
  NASSCAN_LOG_LEVEL: ${NASSCAN_LOG_LEVEL:-}
  TZ: ${TZ:-UTC}

# Container logs rotate at 10 MB, three files each, so they can't fill the pool.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The app containers run as the image's non-root user, with every capability dropped and a
# read-only filesystem; only /tmp (and the volumes below) can be written.
x-app: &app
  # Rewritten by .github/workflows/release.yml on every push to main; keep it on one line.
  image: ${NASSCAN_IMAGE:-ghcr.io/drewsum/nas_scanner:sha-dce21e3}
  environment: *nasscan-env
  restart: unless-stopped
  logging: *logging
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  mem_limit: ${NASSCAN_APP_MEMORY_LIMIT:-1g}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - ${NASSCAN_DATA_DIR:?set NASSCAN_DATA_DIR to the app dataset path}/db:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-run init, Postgres listens only on its socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      # First-run initdb can take minutes on a ZFS dataset; failures during it don't count.
      start_period: 5m
    restart: unless-stopped
    logging: *logging
    mem_limit: ${NASSCAN_DB_MEMORY_LIMIT:-1g}

  migrate:
    <<: *app
    command: ["nasscan", "migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ["nasscan", "api"]
    ports:
      - "${NASSCAN_API_PUBLISH_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  scanner:
    <<: *app
    command: ["nasscan", "scanner"]
    # The NAS data, read-only: the scanner reports and never changes a file.
    volumes:
      - ${NASSCAN_SCAN_ROOT:?set NASSCAN_SCAN_ROOT to the dataset path to scan}:/scan:ro
      # Downloaded YARA rules, kept across restarts and image updates.
      - scanner-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/nasscan-scanner-heartbeat') > 60)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ClamAV (deploy/clamd: the official image plus fangfrisch's unofficial signatures). The
  # scanner streams files to it over the stack's network, so it has no access to the data.
  # The first start downloads ~300 MB of signatures; it needs about 1.5 GB of RAM.
  clamd:
    # Rewritten by .github/workflows/release.yml with the app image; keep it on one line.
    image: ${NASSCAN_CLAMD_IMAGE:-ghcr.io/drewsum/nas_scanner:clamd-sha-dce21e3}
    environment:
      FANGFRISCH_SANESECURITY: ${FANGFRISCH_SANESECURITY:-yes}
      FANGFRISCH_URLHAUS: ${FANGFRISCH_URLHAUS:-no}
      FANGFRISCH_MALWAREPATROL_RECEIPT: ${FANGFRISCH_MALWAREPATROL_RECEIPT:-}
      FANGFRISCH_SECURITEINFO_CUSTOMER_ID: ${FANGFRISCH_SECURITEINFO_CUSTOMER_ID:-}
      TZ: ${TZ:-UTC}
    volumes:
      - clamav-db:/var/lib/clamav
    # The image's init runs as root to prepare its folders and logs for the clamav user, then
    # freshclam and clamd drop to that user. These are the capabilities that takes; the
    # container has no access to the NAS data.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      # The first signature download can take a while.
      start_period: 15m
    restart: unless-stopped
    logging: *logging
    mem_limit: ${NASSCAN_CLAMD_MEMORY_LIMIT:-3g}

  # A pg_dump every NASSCAN_BACKUP_INTERVAL_HOURS into <NASSCAN_DATA_DIR>/backups. Starts as
  # root only to hand that directory to the nasscan user, then runs as it; CHOWN, SETUID and
  # SETGID are all it needs for that.
  backup:
    <<: *app
    user: "0"
    command: ["sh", "-c", "chown nasscan /backups && exec setpriv --reuid=nasscan --regid=nasscan --clear-groups nasscan backup"]
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - ${NASSCAN_DATA_DIR}/backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/nasscan-backup-heartbeat') > 900)"]
      interval: 60s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  scanner-data:
  clamav-db:
