<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}NAS Scanner report{% endblock %}</title>
<style>
  :root { color-scheme: light; --fg: #14211a; --muted: #5d6b63; --line: #d9e2dc; --accent: #147a3d; --bad: #b3261e; --warn: #8a5a00; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  .mast { font: 600 12px/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace; background: #03110a; color: #33ff8a;
          padding: 10px 14px; border-radius: 6px; margin-bottom: 20px; white-space: pre; overflow: hidden; }
  .mast b { color: #c8ffe0; font-weight: 600; }
  .mast i { color: #147a3d; font-style: normal; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 28px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--accent); }
  p { margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
  .wrap { overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 12px 0; }
  .tile { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 4px; padding: 8px 10px; }
  .tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .l { font-size: 12px; color: var(--muted); }
  .bad { color: var(--bad); }
  .warn { color: var(--warn); }
  .ok { color: var(--accent); }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; color: #fff; background: var(--muted); }
  .tag.malicious, .tag.failed { background: var(--bad); }
  .tag.suspicious { background: #b7791f; }
  .tag.completed { background: var(--accent); }
  footer { margin-top: 32px; font-size: 12px; color: var(--muted); }
  @media print {
    main { padding: 0; max-width: none; }
    .mast { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .noprint { display: none; }
    h2 { break-after: avoid; }
    tr { break-inside: avoid; }
  }
</style>
</head>
<body>
<main>
<div class="mast" aria-hidden="true"><b>&#9608;&#9608;&#9608; NAS SCANNER</b> <i>::</i> {% block mast %}report{% endblock %} <i>&#9612;</i></div>
{% block body %}{% endblock %}
<footer>NAS Scanner {{ version }}. Only hashes ever leave the NAS; the scanner never changes a file.
<span class="noprint"> · <a href="javascript:window.print()">Print</a></span></footer>
</main>
</body>
</html>
