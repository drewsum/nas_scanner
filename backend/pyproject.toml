[project]
name = "nasscan"
version = "0.1.0"
description = "NAS malware scanner: nightly file scans with local engines and threat-intel hash lookups"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "croniter>=6.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "oletools>=0.60.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-magic>=0.4.27",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
    "yara-python>=4.5.4",
]

[project.scripts]
nasscan = "nasscan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nasscan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a running PostgreSQL (set NASSCAN_TEST_DATABASE_URL)",
]
filterwarnings = [
    # oletools still uses pyparsing's old names.
    "ignore::DeprecationWarning:oletools.olevba",
]
