# Lint, test and build the image on every pull request. release.yml reuses it on every push to
# main before publishing (and builds the image itself, so it skips that job here).
name: ci

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_image:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: nasscan
          POSTGRES_PASSWORD: nasscan
          POSTGRES_DB: nasscan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nasscan -d nasscan_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NASSCAN_TEST_DATABASE_URL: postgresql+psycopg://nasscan:nasscan@localhost:5432/nasscan_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run -s lint
      - run: npm run -s build

  # The image builds (pushed only by release.yml, from main).
  image:
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_image }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: deploy/clamd
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=clamd
          cache-to: type=gha,mode=max,scope=clamd
